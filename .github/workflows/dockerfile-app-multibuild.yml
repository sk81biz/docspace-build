name: parallel-multilang-build

on:
  push:
    branches:
      - 'hotfix/v*'
      - 'release/v*'
      - 'develop'
    paths:
      - '.github/workflows/dockerfile-app-multibuild.yml'
      - 'docker/Dockerfile.app.multibuild'   # ← remove the leading slash

jobs:
  init:
    runs-on: ubuntu-latest
    outputs:
      PRODUCT_VERSION: ${{ steps.init.outputs.PRODUCT_VERSION }}
      DOCKER_TAG_BASE: ${{ steps.init.outputs.DOCKER_TAG_BASE }}
      BRANCH:          ${{ steps.init.outputs.BRANCH }}
      USE_AWS_BUCKET_CACHE:  ${{ steps.s3check.outputs.use_cache }}
    steps:
      - name: Init
        id: init
        shell: bash
        run: |
          BRANCH="${{ github.ref_name }}"
          if [ "$BRANCH" = "develop" ]; then
            PRODUCT_VERSION="develop"
          else
            PRODUCT_VERSION="$(echo "$BRANCH" | sed '/^release\b\|^hotfix\b\|^feature\b/s/release.*\/\|hotfix.*\/\|feature.*\///; s/-git-action$//; s/^v//')"
          fi
          DOCKER_TAG_BASE="${PRODUCT_VERSION}.${{ github.run_number }}"

          echo "BRANCH=$BRANCH"                       >> "$GITHUB_OUTPUT"
          echo "PRODUCT_VERSION=$PRODUCT_VERSION"     >> "$GITHUB_OUTPUT"
          echo "DOCKER_TAG_BASE=$DOCKER_TAG_BASE"     >> "$GITHUB_OUTPUT"
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Check S3 & set USE_AWS_BUCKET_CACHE
        id: s3check
        shell: bash
        env:
          S3_BUCKET: github-docker-cache-build
        run: |
          set -euo pipefail
          if aws s3api head-bucket --bucket "$S3_BUCKET" >/dev/null 2>&1; then
            echo "S3 reachable: s3://$S3_BUCKET/"
            echo "use_cache=true"  >> "$GITHUB_OUTPUT"
          else
            echo "S3 NOT reachable: s3://$S3_BUCKET (disabling cache)"
            echo "use_cache=false" >> "$GITHUB_OUTPUT"
          fi

  build-java:
    needs: init
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux/amd64] # add linux/arm64 if needed
    env:
      PRODUCT_VERSION: ${{ needs.init.outputs.PRODUCT_VERSION }}
      DOCKER_TAG:      ${{ needs.init.outputs.DOCKER_TAG_BASE }}-java
      BRANCH:          ${{ needs.init.outputs.BRANCH }}
      CACHE_NS:        ${{ secrets.DOCKERHUB_USERNAME }}/app-cache
      IMAGE_NS:        ${{ secrets.DOCKERHUB_USERNAME }}/app-java
    steps:
      - uses: actions/checkout@v4
        with: 
         ref: ${{ env.BRANCH }}

      - name: Check disk space
        id: disk
        run: |
          avail_mb="$(df -Pm / | awk 'NR==2{print $4}')"
          echo "needs_cleanup=$([ "$avail_mb" -lt 20000 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Free space (conditional)
        if: steps.disk.outputs.needs_cleanup == 'true'
        run: |
          curl https://raw.githubusercontent.com/ONLYOFFICE/DocSpace-buildtools/refs/heads/develop/.github/scripts/free-disk-space-linux.sh://raw.githubusercontent.com/ONLYOFFICE/DocSpace-buildtools/refs/heads/release/v3.5.0/.github/scripts/free-disk-space-linux.sh

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push (java)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.app.multibuild 
          target: java-build                  # <- target stage in your multibuild Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.IMAGE_NS }}:${{ env.DOCKER_TAG }}
            ${{ env.IMAGE_NS }}:latest
          build-args: |
            GIT_BRANCH=${{ env.BRANCH }}
            PRODUCT_VERSION=${{ env.PRODUCT_VERSION }}
            BUILD_NUMBER=${{ github.run_number }}
          cache-from: type=registry,ref=${{ env.CACHE_NS }}:java
          cache-to:   type=registry,ref=${{ env.CACHE_NS }}:java,mode=max

  build-node:
    needs: init
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux/amd64]
    env:
      PRODUCT_VERSION: ${{ needs.init.outputs.PRODUCT_VERSION }}
      DOCKER_TAG:      ${{ needs.init.outputs.DOCKER_TAG_BASE }}-node
      BRANCH:          ${{ needs.init.outputs.BRANCH }}
      CACHE_NS:        ${{ secrets.DOCKERHUB_USERNAME }}/app-cache
      IMAGE_NS:        ${{ secrets.DOCKERHUB_USERNAME }}/app-node
      USE_AWS_BUCKET_CACHE: ${{ needs.init.outputs.USE_AWS_BUCKET_CACHE }}
    steps:
      - uses: actions/checkout@v4
        with:  
         ref: ${{ env.BRANCH }}

      - name: Check disk space
        id: disk
        run: |
          avail_mb="$(df -Pm / | awk 'NR==2{print $4}')"
          echo "needs_cleanup=$([ "$avail_mb" -lt 20000 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Free space (conditional)
        if: steps.disk.outputs.needs_cleanup == 'true'
        run: |
          curl https://raw.githubusercontent.com/ONLYOFFICE/DocSpace-buildtools/refs/heads/develop/.github/scripts/free-disk-space-linux.sh://raw.githubusercontent.com/ONLYOFFICE/DocSpace-buildtools/refs/heads/release/v3.5.0/.github/scripts/free-disk-space-linux.sh

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
         aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
         aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
         aws-region:            ${{ secrets.AWS_REGION }}

      - name: Compute pnpm cache key
        # uses pnpm-lock.yaml FROM THE REPO
        id: nodekey
        shell: bash
        run: |
          mkdir -p .cache/node/pnpm-store
          LOCKHASH=$(sha256sum pnpm-lock.yaml | awk '{print $1}')
          echo "LOCKHASH=$LOCKHASH" >> "$GITHUB_OUTPUT"
          echo "S3_PREFIX=s3://github-docker-cache-build/test-nodejs-cache/$LOCKHASH" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store from S3
        if: env.USE_AWS_BUCKET_CACHE == 'true'
        shell: bash
        run: |
         echo "DEBUG S3 prefix: ${{ steps.nodekey.outputs.S3_PREFIX }}/pnpm-store"
         aws s3 sync "${{ steps.nodekey.outputs.S3_PREFIX }}/pnpm-store" ".cache/node/pnpm-store" --no-progress || true

      - name: Prewarm store with lockfile
        env:
          PNPM_STORE_PATH: .cache/node/pnpm-store
        run: |
         echo "store-dir=$PNPM_STORE_PATH" >> .npmrc
         pnpm fetch --frozen-lockfile

      - name: Build & push (node)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.app.multibuild 
          target: build-node
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.IMAGE_NS }}:${{ env.DOCKER_TAG }}
            ${{ env.IMAGE_NS }}:latest
          build-args: |
            GIT_BRANCH=${{ env.BRANCH }}
            PRODUCT_VERSION=${{ env.PRODUCT_VERSION }}
            BUILD_NUMBER=${{ github.run_number }}
          cache-from: type=registry,ref=${{ env.CACHE_NS }}:node
          cache-to:   type=registry,ref=${{ env.CACHE_NS }}:node,mode=max
      
      - name: Upload pnpm store to S3
        if: always() && env.USE_AWS_BUCKET_CACHE == 'true'
        run: |
          aws s3 sync ".cache/node/pnpm-store" "${{ steps.nodekey.outputs.S3_PREFIX }}/pnpm-store" --no-progress --delete

  build-dotnet:
    needs: init
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux/amd64]
    env:
      PRODUCT_VERSION: ${{ needs.init.outputs.PRODUCT_VERSION }}
      DOCKER_TAG:      ${{ needs.init.outputs.DOCKER_TAG_BASE }}-dotnet
      BRANCH:          ${{ needs.init.outputs.BRANCH }}
      CACHE_NS:        ${{ secrets.DOCKERHUB_USERNAME }}/app-cache
      IMAGE_NS:        ${{ secrets.DOCKERHUB_USERNAME }}/app-dotnet
    steps:
      - uses: actions/checkout@v4
        with: 
         ref: ${{ env.BRANCH }}

      - name: Check disk space
        id: disk
        run: |
          avail_mb="$(df -Pm / | awk 'NR==2{print $4}')"
          echo "needs_cleanup=$([ "$avail_mb" -lt 50000 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Free space (conditional)
        if: steps.disk.outputs.needs_cleanup == 'true'
        run: |
          curl https://raw.githubusercontent.com/ONLYOFFICE/DocSpace-buildtools/refs/heads/develop/.github/scripts/free-disk-space-linux.sh | bash
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push (dotnet)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.app.multibuild 
          target:  build-dotnet
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.IMAGE_NS }}:${{ env.DOCKER_TAG }}
            ${{ env.IMAGE_NS }}:latest
          build-args: |
            GIT_BRANCH=${{ env.BRANCH }}
            PRODUCT_VERSION=${{ env.PRODUCT_VERSION }}
            BUILD_NUMBER=${{ github.run_number }}
          cache-from: type=registry,ref=${{ env.CACHE_NS }}:dotnet
          cache-to:   type=registry,ref=${{ env.CACHE_NS }}:dotnet,mode=max













